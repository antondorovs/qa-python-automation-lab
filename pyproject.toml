[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-python-automation-lab"
version = "0.1.0"
description = "Hands-on Python QA automation lab for API, UI and data validation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]
ui = ["playwright>=1.50,<2"]
dev = ["pytest>=8,<10", "playwright>=1.50,<2", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not ui'"
markers = [
  "api: local HTTP API checks",
  "contract: response and data shape checks",
  "data: SQLite data quality checks",
  "smoke: short critical-path checks",
  "ui: browser checks requiring Playwright and Chromium",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
